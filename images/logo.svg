<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="ecoastGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06d6a0" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon: Hexagon Shield with Circuit & Atom/Satellite Nodes -->
  <g transform="translate(15, 10)">
    <!-- Outer Shield Hexagon -->
    <polygon points="50,5 92,27 92,73 50,95 8,73 8,27" 
             stroke="url(#ecoastGrad)" stroke-width="4" fill="rgba(11, 19, 43, 0.8)" />
             
    <!-- Inner Orbit Rings / Tech Core -->
    <circle cx="50" cy="50" r="28" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="6 4" />
    <circle cx="50" cy="50" r="14" fill="url(#ecoastGrad)" opacity="0.9" />
    <circle cx="50" cy="50" r="6" fill="#ffffff" />
    
    <!-- Circuit nodes -->
    <line x1="50" y1="5" x2="50" y2="22" stroke="#00f0ff" stroke-width="2.5" />
    <line x1="92" y1="27" x2="74" y2="38" stroke="#00f0ff" stroke-width="2.5" />
    <line x1="92" y1="73" x2="74" y2="62" stroke="#3b82f6" stroke-width="2.5" />
    <line x1="50" y1="95" x2="50" y2="78" stroke="#8b5cf6" stroke-width="2.5" />
    <line x1="8" y1="73" x2="26" y2="62" stroke="#06d6a0" stroke-width="2.5" />
    <line x1="8" y1="27" x2="26" y2="38" stroke="#00f0ff" stroke-width="2.5" />

    <circle cx="50" cy="5" r="3" fill="#00f0ff" />
    <circle cx="92" cy="27" r="3" fill="#00f0ff" />
    <circle cx="92" cy="73" r="3" fill="#3b82f6" />
    <circle cx="50" cy="95" r="3" fill="#8b5cf6" />
    <circle cx="8" cy="73" r="3" fill="#06d6a0" />
    <circle cx="8" cy="27" r="3" fill="#00f0ff" />
  </g>

  <!-- Typography -->
  <!-- Main Brand Name -->
  <text x="130" y="58" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" letter-spacing="3" fill="#ffffff">
    E<tspan fill="#00f0ff">COAST</tspan>
  </text>
  
  <!-- Subtitle / Full Name -->
  <text x="132" y="80" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="11" letter-spacing="2" fill="#94a3b8">
    ENGINEERING COMPUTING ACADEMY
  </text>
  <text x="132" y="96" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="10.5" letter-spacing="1.5" fill="#38bdf8">
    OF SCIENCE AND TECHNOLOGY
  </text>
  
  <!-- Accent Line -->
  <rect x="132" y="103" width="280" height="2" fill="url(#ecoastGrad)" rx="1" />
</svg>
